specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Veriff
providerId: veriff-com
created: '2026-07-01'
modified: '2026-07-01'
reconciled: false
tags:
- Identity Verification
- KYC
- AML
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Veriff spend. Veriff bills on a per-verification basis - each
  completed identity check is the primary cost unit - with add-on modules
  (AML/watchlist screening, proof of address, database/registry verification,
  fraud intelligence) metered on top. Pricing is contract-negotiated with
  volume tiers, so cost optimization centers on routing only the verifications
  and modules that are actually required, avoiding redundant re-verifications,
  and forecasting completed-verification volume against committed tiers.
notes: >-
  Unit rates are contract-specific and not publicly listed; map actual invoice
  line items during reconciliation.
sources:
- https://www.veriff.com/pricing
- https://devdocs.veriff.com
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Veriff
serviceCategory: Identity and Fraud
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Veriff Identity Verification
  ServiceCategory: Identity and Fraud
  ProviderName: Veriff
  PublisherName: Veriff
  InvoiceIssuerName: Veriff
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: completed_verifications
  description: Completed identity verifications (approved/declined) - the primary cost unit.
  unit: verifications
  aggregation: sum
  dimensions:
  - integration
  - documentType
  - country
- name: watchlist_screenings
  description: AML PEP/sanctions/adverse-media watchlist screenings performed.
  unit: screenings
  aggregation: sum
  dimensions:
  - integration
- name: proof_of_address_checks
  description: Proof-of-address verifications performed.
  unit: verifications
  aggregation: sum
  dimensions:
  - integration
- name: database_verifications
  description: Database/registry identity verifications performed.
  unit: verifications
  aggregation: sum
  dimensions:
  - integration
  - registry
- name: fraud_intelligence_checks
  description: Fraud-intelligence / device and risk-signal checks performed.
  unit: checks
  aggregation: sum
  dimensions:
  - integration
principles:
- name: Visibility
  description: Pull Veriff usage/invoice exports; track completed verifications by integration, document type, and country.
- name: Allocation
  description: Use vendorData / separate integrations per product line to attribute verification spend to teams and workflows.
- name: Optimization
  description: >-
    Only enable the add-on modules a workflow needs; avoid redundant
    re-verifications; use webhooks (not polling) to stay within volume; align
    committed volume tiers with real onboarding forecasts.
- name: Accountability
  description: Assign owners per integration/product; review verification spend monthly against committed volume.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
