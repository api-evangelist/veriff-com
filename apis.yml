aid: veriff-com
url: https://raw.githubusercontent.com/api-evangelist/veriff-com/refs/heads/main/apis.yml
name: Veriff
kind: company
description: Veriff is a global identity verification platform that combines AI and
  human review to verify people online. Its API-first IDV stack covers document and
  biometric (face-match, liveness) verification, KYC/AML onboarding, proof of address,
  and database/watchlist (PEP and sanctions) screening, orchestrated around verification
  sessions with HMAC-secured REST endpoints and decision/event webhooks.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Identity Verification
- KYC
- AML
- Biometrics
- Document Verification
- Fraud Prevention
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'
